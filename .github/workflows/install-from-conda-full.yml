# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Pyfive Test Conda Pkg

on:
  push:
    branches:
      - main
      - full_conda_package_test
  schedule:
    - cron: "0 4 * * *"

# Required shell entrypoint to have properly configured bash shell
defaults:
  run:
    shell: bash -l {0}

jobs:
  build:

    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: conda-incubator/setup-miniconda@v4.0.1
        with:
          activate-environment: pyfive
          environment-file: environment.yml
          python-version: ${{ matrix.python-version }}
          miniforge-version: "latest"
          use-mamba: true
      - name: Install Pyfive from Conda
        run: mamba install -c conda-forge pyfive
      - name: Check environment contents
        run: |
          conda list
          pip list
      - name: Test p5dump
        run: |
          which p5dump
          p5dump tests/data/groups.hdf5
          p5dump tests/data/issue23_A.nc
      - name: Test with pytest
        run: |
          python -c "import pyfive"
          # pytest tries to split test_threadsafe_data_access.py
          # and that can not be run with eg pytest -n N
          pytest
